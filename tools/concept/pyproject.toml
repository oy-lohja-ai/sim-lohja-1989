[project]
name = "sim-lohja-1989-tools"
version = "0.1.0"
description = "SIM LOHJA 1989: Python-kirjasto demon grafiikan piirtoon ja C64-muunnoksiin (build)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pillow>=11,<13",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concept"]
